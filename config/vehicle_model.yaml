# MORAI 대회 차량 모델 제원
# 출처: 세부규정집 2026 차량 모델 항목 및 사용자가 제공한 차량 제원 이미지

model: 2025_Hyundai_ioniq5

dimensions_m:
  length: 4.635
  width: 1.892
  height: 2.434
  wheelbase: 3.000
  front_overhang: 0.845
  rear_overhang: 0.790

steering:
  minimum_turning_radius: 5.87
  maximum_wheel_angle_deg: 40.0
  maximum_wheel_angle_rad: 0.6981317008

notes:
  - Pure Pursuit의 wheelbase는 뒤 차축 중앙에서 앞 차축 중앙까지의 3.000 m를 사용한다.
  - 최대 휠각 40도는 Pure Pursuit 조향 출력의 안전 상한으로 사용한다.
  - 최소 회전반경 5.87 m는 차량 제원 검증값이며, 조향각 라디안으로 직접 변환해 사용하지 않는다.
  - MORAI CtrlCmd의 steering 부호와 단위는 실제 설치된 morai_msgs에서 저속으로 검증한다.
